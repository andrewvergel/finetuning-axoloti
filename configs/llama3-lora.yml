base_model: meta-llama/Llama-3-8B-Instruct
adapter: lora
datasets:
  - path: data/train.jsonl
    type: alpaca
dataset_format: instruction
output_dir: ./outputs/llama3-lora
train:
  max_steps: 200
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 2e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05