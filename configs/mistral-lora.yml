base_model: mistralai/Mistral-7B-Instruct-v0.3
adapter: lora

datasets:
  - path: data/train.jsonl
    type: alpaca

dataset_format: instruction

output_dir: ./outputs/mistral-lora

micro_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 200
learning_rate: 2e-4

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# ✅ Critical fix
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
