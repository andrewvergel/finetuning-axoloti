base_model: meta-llama/Llama-3-8B-Instruct
adapter: lora

datasets:
  - path: data/train.jsonl
    type: alpaca

dataset_format: instruction

output_dir: ./outputs/llama3-lora

# ✅ Training settings must be top-level
micro_batch_size: 1                     # batch per GPU
gradient_accumulation_steps: 8          # to simulate larger batch
max_steps: 200
learning_rate: 2e-4

# ✅ LoRA parameters
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
